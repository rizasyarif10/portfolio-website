<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Mochamad Riza Syarif, a Frontend Engineer focused on modern web applications, dashboards, and geospatial experiences." />
    <meta name="theme-color" content="#efeeea" />
    <script>
      (() => {
        const savedTheme = localStorage.getItem("portfolio-theme");
        document.documentElement.dataset.theme = savedTheme === "dark" ? "dark" : "light";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link
      rel="preload"
      as="image"
      href="/profile-photo-480.webp"
      type="image/webp"
      imagesrcset="/profile-photo-480.webp 480w, /profile-photo-800.webp 800w, /profile-photo-1066.webp 1066w"
      imagesizes="(max-width: 620px) calc(100vw - 16px), (max-width: 900px) 42vw, 360px"
      fetchpriority="high"
    />
    <title>Mochamad Riza Syarif — Frontend Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
